<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - DevShowcase</title>
    <meta name="description" content="Create your developer portfolio account">
    <link rel="stylesheet" href="{% static 'styles.css' %}">
</head>
<body>
    <header class="header">
        <div class="container">
            <h1 class="logo"><a href="{% url 'index' %}">DevShowcase</a></h1>
            <nav>
                <a href="{% url 'index' %}" class="btn-secondary">Login</a>
            </nav>
        </div>
    </header>

    <main>
        <section class="signup-section">
            <div class="container">
                <div class="signup-card">
                    <h2>Create Your Account</h2>

                    {% if messages %}
                        <ul class="messages">
                            {% for message in messages %}
                                <li class="{{ message.tags }}">{{ message }}</li>
                            {% endfor %}
                        </ul>
                    {% endif %}

                    <form method="POST" action="">
                        {% csrf_token %}
                        <div class="form-group">
                            <label for="username">Username</label>
                            <input type="text" id="username" name="username" required placeholder="Your unique username">
                            <small>This will be your portfolio URL: /portfolio/username</small>
                        </div>
                        <div class="form-group">
                            <label for="email">Email</label>
                            <input type="email" id="email" name="email" required>
                        </div>
                        <div class="form-group">
                            <label for="password">Password</label>
                            <input type="password" id="password" name="password" required minlength="6">
                        </div>
                        <div class="form-group">
                            <label for="confirmPassword">Confirm Password</label>
                            <input type="password" id="confirmPassword" name="confirmPassword" required>
                        </div>
                        <button type="submit" class="btn-primary">Sign Up</button>
                        <p class="form-footer">Already have an account? <a href="{% url 'index' %}">Login</a></p>
                    </form>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
